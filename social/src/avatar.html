<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downstage — Profile picture</title>
<link rel="stylesheet" href="promo.css">
<style>
  /* 1080×1080, made to be cut to a circle: the icon fits inside it. */
  .canvas { width: 1080px; height: 1080px; }
  .ring { left: 60px; top: 60px; width: 960px; height: 960px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255, 46, 136, 0.55), inset 0 0 60px rgba(255, 46, 136, 0.25), 0 0 60px rgba(24, 240, 255, 0.12); }
  .icon { left: 130px; top: 122px; width: 820px; height: 820px; filter: drop-shadow(0 0 50px rgba(255, 46, 136, 0.45)) drop-shadow(0 0 120px rgba(24, 240, 255, 0.22)); }
</style>
</head>
<body>
<div class="canvas">
  <div class="layer ring"></div>
  <img class="layer icon" src="img/icon.svg" alt="">
</div>
</body>
</html>
