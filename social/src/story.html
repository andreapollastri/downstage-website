<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downstage — Story</title>
<link rel="stylesheet" href="promo.css">
<style>
  /* Stories cover the top and bottom ~250 px with their own controls: everything that matters sits between. */
  .canvas { width: 1080px; height: 1920px; }
  .top { left: 0; right: 0; top: 262px; display: flex; justify-content: center; }
  .top .kicker { font-size: 22px; }
  .head { left: 0; right: 0; top: 352px; text-align: center; }
  .head .title { font-size: 232px; }
  .head .title span { display: block; }
  .head .script { font-size: 76px; display: inline-block; margin-top: 34px; transform-origin: center; }
  .stage { left: 88px; right: 88px; top: 912px; perspective: 1700px; }
  .stage .monitor { transform: rotateX(7deg) rotateY(-8deg) rotateZ(-1.5deg); }
  .tape { position: absolute; z-index: 4; }
  .cta { left: 0; right: 0; top: 1540px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .cta .btn { height: 92px; padding: 0 46px; font-size: 44px; }
  .cta .btn svg { width: 36px; height: 36px; }
  .cta .url { font-size: 50px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="layer top"><span class="kicker"><i></i>Free for Mac · version 1.0.0</span></div>
  <div class="layer head">
    <h1 class="title"><span class="tube">DOWN</span><span class="neon-pink">STAGE</span></h1>
    <span class="script neon-cyan">Record. Mix. Play it loud.</span>
  </div>
  <div class="layer stage">
    <div class="monitor"><img src="img/mix.jpg" alt=""><span class="floor"></span></div>
  </div>
  <span class="tape" style="left: 44px; top: 900px; --tilt: -5deg"><b>48</b> channels</span>
  <span class="tape" style="right: 40px; top: 948px; --tilt: 4deg"><b>64</b>-slot rack</span>
  <span class="tape" style="left: 56px; top: 1404px; --tilt: 3deg"><b>8</b> FX buses</span>
  <span class="tape" style="right: 50px; top: 1392px; --tilt: -4deg"><b>0</b> subscriptions</span>
  <div class="layer cta">
    <span class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
      Download free for Mac
    </span>
    <span class="url neon-cyan">downstage.it</span>
  </div>
</div>
</body>
</html>
