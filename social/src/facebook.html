<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downstage — Facebook cover</title>
<link rel="stylesheet" href="promo.css">
<style>
  /* 1640×624. Phones crop the sides to about the middle 1100 px: the words stay there. */
  .canvas { width: 1640px; height: 624px; }
  .left { left: -250px; top: 130px; width: 600px; perspective: 1300px; }
  .left .monitor { padding: 9px; border-radius: 14px; transform: rotateY(24deg) rotateX(4deg); transform-origin: right center; }
  .right { right: -250px; top: 130px; width: 600px; perspective: 1300px; }
  .right .monitor { padding: 9px; border-radius: 14px; transform: rotateY(-24deg) rotateX(4deg); transform-origin: left center; }
  .monitor img { border-radius: 7px; }
  .copy { left: 0; right: 0; top: 112px; text-align: center; }
  .copy .title { font-size: 168px; }
  .copy .script { display: inline-block; font-size: 60px; margin-top: 26px; transform-origin: center; }
  .copy .line { margin-top: 36px; font: 600 23px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); }
  .copy .line .url { font: 400 40px/1 var(--display); letter-spacing: 0.06em; text-transform: none; margin-left: 18px; vertical-align: -4px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="layer left"><div class="monitor"><img src="img/mix.jpg" alt=""></div></div>
  <div class="layer right"><div class="monitor"><img src="img/groups.jpg" alt=""></div></div>
  <div class="layer copy">
    <h1 class="title"><span class="tube">DOWN</span><span class="neon-pink">STAGE</span></h1>
    <span class="script neon-cyan">Record. Mix. Play it loud.</span>
    <div class="line">A free DAW for Mac<span class="url neon-cyan">downstage.it</span></div>
  </div>
</div>
</body>
</html>
