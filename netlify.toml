# downstage.it — a static site, published from the site folder.
[build]
  publish = "site"
  command = ""

[[redirects]]
  from = "/download"
  to = "/downloads/Downstage-1.0.0-macOS-arm64.dmg"
  status = 302

[[redirects]]
  from = "/license"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/downloads/*.dmg"
  [headers.values]
    Content-Type = "application/x-apple-diskimage"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/downloads/*.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=86400"

# The update manifest the app reads: never cached, so a new release is seen at once.
[[headers]]
  for = "/updates/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
